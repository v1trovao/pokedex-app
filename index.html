        <!--Teste do select -->
        <div id="filterTypes">
            Tipos:
            <select id="selectFilter" aria-placeholder="tipos">
                <option value="all">All</option>
                <option value="grass">Grass</option>
                <option value="poison">Poison</option>
                <option value="fire">Fire</option>
                <option value="water">Water</option>
                <option value="normal">Normal</option>
                <option value="flying">Flying</option>
                <option value="bug">Bug</option>
                <option value="rock">Rock</option>
                <option value="ground">Ground</option>
                <option value="electric">Electric</option>
                <option value="psychic">Psychic</option>
                <option value="dark">Dark</option>
                <option value="poison">Poison</option>
                <option value="steel">Steel</option>

                <option value="fairy">Fairy</option>
                <option value="dragon">Dragon</option>
                <option value="ice">Ice</option>
            </select>  
        </div>

        <div id="filterGen">
            Region:
            <select id="selectGen">
                <option value="i">Kanto</option>
                <option value="ii">Johto</option>
                <option value="iii">Hoenn</option>
                <option value="iv">Sinnoh</option>
                <option value="v">Unova</option>

    <div id="container">
        <div id="poke-container" class="ui cards">
            
        </div>

    <!-- Janela do Modal dos Cards Pokemon-->
    <div class="modal">

        <!-- Conteúdo do Modal -->
        <div class="modal-card">
            
            <span class="fechar">x</span>
            <div class="card-header">
                <h3 id="pokeId">
                    #<span id="modal-card-id"></span> 
                </h3>
                <span id="modal-card-name" ></span>
                <img id="modal-img">
                <span id="modal-card-genus"></span>
                <span id="modal-card-types" class="type-box"></span>
            </div>
            
            <div class=poke-info id="pokeInfo"></div>
            
        </div>
    </div>
